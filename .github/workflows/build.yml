name: Build Marmara Connector with PyInstaller

on:
  push:
    branches: [ remove-fbs ]
  pull_request:
    branches: [ remove-fbs ]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xfixes0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: |
        pyinstaller marmara-connection.spec
        # Или если spec файла нет:
        # pyinstaller --onefile --windowed --name "MarmaraConnector" src/main.py
    
    - name: Upload Linux executable
      uses: actions/upload-artifact@v4
      with:
        name: marmara-connector-linux
        path: dist/
        retention-days: 7

  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pywin32
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: |
        pyinstaller marmara-connection.spec
        # Или если spec файла нет:
        # pyinstaller --onefile --windowed --name "MarmaraConnector" --icon=icon.ico src/main.py
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: marmara-connector-windows
        path: dist/
        retention-days: 7

  build_macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: |
        pyinstaller marmara-connection.spec
        # Или если spec файла нет:
        # pyinstaller --onefile --windowed --name "MarmaraConnector" src/main.py
    
    - name: Upload macOS executable
      uses: actions/upload-artifact@v4
      with:
        name: marmara-connector-macos
        path: dist/
        retention-days: 7
