name: Build Marmara Connector with PyInstaller

on:
  push:
    branches: [ remove-fbs ]
  pull_request:
    branches: [ remove-fbs ]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Explore repository structure
      run: |
        echo "Repository structure:"
        find . -type f -name "*.py" -o -name "*.spec" -o -name "main.py" -o -name "app.py" | head -20
        echo "---"
        ls -la
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xfixes0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Find entry point and build
      run: |
        # Поиск главного файла
        if [ -f "main.py" ]; then
          ENTRY_POINT="main.py"
        elif [ -f "src/main.py" ]; then
          ENTRY_POINT="src/main.py"
        elif [ -f "app.py" ]; then
          ENTRY_POINT="app.py"
        else
          # Найдем первый подходящий Python файл
          ENTRY_POINT=$(find . -name "*.py" -type f | grep -v test | head -1)
        fi
        
        echo "Using entry point: $ENTRY_POINT"
        
        # Сборка
        pyinstaller --onefile --windowed --name "MarmaraConnector" "$ENTRY_POINT"
    
    - name: Upload Linux executable
      uses: actions/upload-artifact@v4
      with:
        name: marmara-connector-linux
        path: dist/
        retention-days: 7

  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Explore repository structure
      run: |
        dir /s /b *.py *.spec main.py app.py
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pywin32
        pip install -r requirements.txt
    
    - name: Find entry point and build
      run: |
        # Поиск главного файла на Windows
        if (Test-Path "main.py") {
          $ENTRY_POINT = "main.py"
        } elseif (Test-Path "src\main.py") {
          $ENTRY_POINT = "src\main.py"
        } elseif (Test-Path "app.py") {
          $ENTRY_POINT = "app.py"
        } else {
          # Найдем первый подходящий Python файл
          $ENTRY_POINT = Get-ChildItem -Recurse -Filter "*.py" | Where-Object { $_.Name -notmatch "test" } | Select-Object -First 1
          $ENTRY_POINT = $ENTRY_POINT.FullName
        }
        
        Write-Host "Using entry point: $ENTRY_POINT"
        
        # Сборка
        pyinstaller --onefile --windowed --name "MarmaraConnector" "$ENTRY_POINT"
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: marmara-connector-windows
        path: dist/
        retention-days: 7
